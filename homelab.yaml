# How Homelab runs this app. See https://github.com/rupaai/homelab (docs/services.md).
id: northern-lights
name: Northern Lights
icon: 🎬

# CI pushes ghcr.io/rupaai/smart-recommender-player:sha-<commit> for every push to main.
image: ghcr.io/rupaai/smart-recommender-player
tag: "sha-{commit}"
build:
  branch: main
  workflow: ci.yml

port: 8000
health: /healthz
promotion: auto-dev        # new builds go to dev on their own; prod waits for Promote
environments: [dev, prod]

# Each environment gets its own copy of these folders. Prod's are copied before every promote.
data:
  - {name: data, path: /data}
  - {name: models, path: /models}
# The catalogue database is the SQLite file the app already uses. Homelab's Databases screen
# shows it, copies it, copies prod to dev and can restore it. Nothing moves (homelab #27).
# DATABASE_PATH below stays the same path, for Homelab versions without this.
database: {engine: sqlite, path: /data/catalogue_full.db}
# The device's media folder (config.yaml on the device: folders: {media: ...}).
folders:
  - {name: media, path: /media}
# Prod only: 8000 is the address the TV app and the Mac already use; the rest are torrent peers.
ports: ["8000:8000", "6881-6891:6881-6891", "6881-6891:6881-6891/udp"]

env:
  CONFIG_PATH: /app/homelab/config.yaml
  MODELS_DIR: /models/current
  DATABASE_PATH: /data/catalogue_full.db
  JELLYFIN_URL: http://jellyfin:8096
  PROWLARR_URL: http://prowlarr:9696
  OLLAMA_URL: http://ollama:11434   # Wishmatch's wish reader (PROJECT_HANDOVER.md §17)

# You type these in the companion.
secrets: [TMDB_API_KEY, JELLYFIN_API_KEY, JELLYFIN_USER_ID, PROWLARR_API_KEY]
# Homelab makes these itself. ADMIN_TOKEN is what the Mac sends (ops/mac): copy it from
# Apps -> Northern Lights -> Secrets. Cast links need no secret from you; the app keeps its own in /data.
generate_secrets: [ADMIN_TOKEN]
# Secrets come as files in /run/secrets, not env vars, so they don't show in docker inspect.
# services/homelab_secrets.py reads them at start-up. Needs Homelab with secrets_as (homelab #21).
secrets_as: files
memory: 2g

services:
  - name: jellyfin
    image: jellyfin/jellyfin:10.11.11
    data: [{name: jellyfin-config, path: /config}, {name: jellyfin-cache, path: /cache}]
    folders: [{name: media, path: /media}]
    ports: ["8096:8096"]
    gpu: true               # Intel Quick Sync
    memory: 4g
  - name: prowlarr
    image: lscr.io/linuxserver/prowlarr:version-2.6.5.5623
    env: {PUID: "1000", PGID: "1000"}
    data: [{name: prowlarr-config, path: /config}]
    ports: ["9696:9696"]
    memory: 512m
  # Ollama runs the small open-weight model that reads Wishmatch wishes. No ports: only the app
  # reaches it. Idle it is a sleeping process; the model loads on a search and unloads after
  # OLLAMA_KEEP_ALIVE without one. Dev gets its own (empty) copy, as every service does, but only
  # prod downloads the model (wishmatch.wish_reader.pull_in), so dev uses the word lookup.
  - name: ollama
    image: ollama/ollama:0.40.1
    env: {OLLAMA_KEEP_ALIVE: "1h", OLLAMA_MAX_LOADED_MODELS: "1", OLLAMA_NUM_PARALLEL: "1"}
    data: [{name: ollama-models, path: /root/.ollama}]
    memory: 3g
