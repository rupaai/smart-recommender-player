# How Homelab runs this app. See https://github.com/rupaai/homelab (docs/services.md).
id: northern-lights
name: Northern Lights
icon: 🎬

# CI pushes ghcr.io/rupaai/smart-recommender-player:sha-<commit> for every push to main.
image: ghcr.io/rupaai/smart-recommender-player
tag: "sha-{commit}"
build:
  branch: main
  workflow: ci.yml

port: 8000
health: /healthz
promotion: auto-dev        # new builds go to dev on their own; prod waits for Promote
environments: [dev, prod]

# Each environment gets its own copy of these folders. Prod's are copied before every promote.
data:
  - {name: data, path: /data}
  - {name: models, path: /models}
# The device's media folder (config.yaml on the device: folders: {media: ...}).
folders:
  - {name: media, path: /media}
# Prod only: 8000 is the address the TV app and the Mac already use; the rest are torrent peers.
ports: ["8000:8000", "6881-6891:6881-6891", "6881-6891:6881-6891/udp"]

env:
  CONFIG_PATH: /app/homelab/config.yaml
  MODELS_DIR: /models/current
  DATABASE_PATH: /data/catalogue_full.db
  JELLYFIN_URL: http://jellyfin:8096
  PROWLARR_URL: http://prowlarr:9696

# You type these in the companion.
secrets: [TMDB_API_KEY, JELLYFIN_API_KEY, JELLYFIN_USER_ID, PROWLARR_API_KEY]
# Homelab makes these itself. ADMIN_TOKEN is what the Mac sends (ops/mac): copy it from
# Apps -> Northern Lights -> Secrets. Cast links need no secret from you; the app keeps its own in /data.
generate_secrets: [ADMIN_TOKEN]
memory: 2g

services:
  - name: jellyfin
    image: jellyfin/jellyfin:10.11.11
    data: [{name: jellyfin-config, path: /config}, {name: jellyfin-cache, path: /cache}]
    folders: [{name: media, path: /media}]
    ports: ["8096:8096"]
    gpu: true               # Intel Quick Sync
    memory: 4g
  - name: prowlarr
    image: lscr.io/linuxserver/prowlarr:version-2.6.5.5623
    env: {PUID: "1000", PGID: "1000"}
    data: [{name: prowlarr-config, path: /config}]
    ports: ["9696:9696"]
    memory: 512m
