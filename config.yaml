# Northern Lights settings: shared defaults that suit anyone.
#
# Your own setup (people, media folders, server address) goes in config.local.yaml next
# to this file. Git ignores it. Copy config.local.example.yaml to start. Anything you
# write there is laid over this file (services/app_config.py explains how).
# The server (Homelab) uses homelab/config.yaml instead of this file.

# Folders to scan for media files (can be multiple paths)
media_folders:                      # scanner scans both roots
  - media/Movies
  - media/Shows

# Jellyfin dedicated library configuration
jellyfin_library:
  movie_dir: media/Movies
  tv_dir: media/Shows
  movies_library_name: Movies
  tv_library_name: TV Shows
  realtime_monitor: true

# TMDB region for release info (e.g., GB, US)
region: GB

# Supported video file extensions
supported_extensions:
  - .mkv
  - .mp4
  - .avi
  - .mov
  - .m4v
  - .webm

# Database file location (DATABASE_PATH env var overrides this at launch)
database_path: catalogue_full.db

# Recommender preferences
recommender:
  default_top_n: 5
  exclude_watched: true
  enable_tier2_profiling: true

  # Candidate funnel sizes (quality cut → diverse pool):
  shortlist_size: 500     # top-rated items kept after the Bayesian quality cut
  final_pool: 200         # diverse pool served for pagination
  # Taste formula: average = how much more you liked a genre than your own
  # average, averaged over a film's genres (utils/eval_taste_formula.py checks it);
  # sum = the old capped sum of liked-genre weights.
  taste_formula: average

  # Mood-map questions (services/mood_popup.py): score = pool score + mood_weight x
  # sum over moods of P(mood) x fit(film, mood). Higher = answers move the order more.
  mood_weight: 3.0

  # Which engine answers on every screen: legacy (the rules engine) or wishmatch
  # (PROJECT_HANDOVER.md §17; its settings are in recommender_rules.yaml, wishmatch:).
  # Wishmatch falls back to legacy if it fails.
  engine: legacy

  # Learned taste from verdicts, "what worked / didn't" chips and vibe-check answers
  # (services/taste_model.py). Adds weight x facet_fit and weight x cluster_affinity
  # (each -1..+1) to the score in both engines. Below min_verdicts nothing changes.
  taste_model:
    enabled: false          # off until the offline check shows it beats the current ordering
    weights:
      facet_fit: 1.0        # design doc 2.6
      cluster_affinity: 0.8
    min_verdicts: 10        # confirmed + inferred verdicts needed per profile
    inferred_weight: 0.5    # an inferred verdict counts this much of a confirmed one
    min_dial_evidence: 4.0  # weighted films that need a value for a dial before it counts
    overall_k: 10.0         # thin-history damping: effect x n / (n + overall_k)
    cluster_k: 5.0          # cluster shrink: n / (n + cluster_k)

# "Best match" sort for download copies: score = quality x seeder health x size fit
# (x scope match for TV). Every number is optional; defaults live in
# services/torrent_ranking.py. Tweak here, restart the server.
torrent_ranking:
  quality_points: {2160p: 100, 1080p: 80, 720p: 55, HD: 45, 480p: 25}
  seeders:
    base: 5               # seeders needed to finish = base + per_gb * size_gb
    per_gb: 2             # health = sqrt(seeders / needed), capped at 1
  size_fit_penalty: 0.75  # x this when far smaller/bigger than normal for its quality
  movie_size_bands_gb:    # normal [min, max] GB per film
    2160p: [4, 30]
    1080p: [1.4, 15]
    720p: [0.6, 4]
    HD: [0.6, 6]
    480p: [0.3, 2]
  episode_size_bands_gb:  # normal [min, max] GB per episode (packs are divided by episode count)
    2160p: [1.5, 10]
    1080p: [0.5, 4]
    720p: [0.2, 1.5]
    HD: [0.2, 2]
    480p: [0.1, 0.8]
  scope_mismatch_multiplier: 0.5  # season pack when you searched an episode, or the reverse
  episodes_per_season: 10         # assumed when a pack's name doesn't say

# Northern Lights "Who's watching" (M4). With no people the app has one viewer
# (JELLYFIN_USER_ID) and no who's-watching screen. Add your people in config.local.yaml
# (see config.local.example.yaml): each needs a Jellyfin user and a ratings profile.
northern_lights: {}

# libtorrent configuration
torrent:
  # Port range for incoming connections
  min_port: 6881
  max_port: 6891
  
  # Where to save downloaded files
  download_dir: downloads
  
  # Disk guard (services/disk_guard.py): refuse a download that would push the media
  # folders + downloads over max_media_gb (0 = no cap) or leave less than min_free_gb free.
  max_media_gb: 0
  min_free_gb: 20

  # Additional libtorrent settings
  settings:
    upload_rate_limit: 0      # 0 = unlimited
    download_rate_limit: 0    # 0 = unlimited
    active_downloads: 3      # Max simultaneous downloads
    active_seeds: 3           # Max simultaneous uploads
    enable_dht: true          # Enable distributed hash table
    enable_lsd: true           # Enable local service discovery
    enable_natpmp: true        # Enable NAT-PMP port mapping
    enable_upnp: true          # Enable UPnP port mapping

# Nightly job on the Mac (ops/mac/nightly.sh). Not read by the server.
nightly:
  # Quality floor for NEW catalogue items found by the weekly refresh: anything below it is
  # never added, so garbage titles stay out. Items already in the catalogue are never removed.
  min_vote_count: 200
  min_rating: 6.0
  # A new model is published only if no metric is more than this many percent worse than the
  # one the server runs now (taste_spearman, taste_auc).
  gate_max_drop_pct: 1.0
  # Number of titles to mood-tag per weekly refresh with the Anthropic API. 0 = off. Each tag
  # costs API credit, so this ships off.
  mood_tag_limit: 0
  keep_backup_days: 30
