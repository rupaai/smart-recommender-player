<!DOCTYPE html>
<html lang="en"{% if surface == 'laptop' %} class="laptop"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b15">
  <title>{% block title %}Northern Lights{% endblock %}</title>
  <link rel="stylesheet" href="/static/nl/tv/tv.css">
  <link rel="stylesheet" href="/static/nl/subtitles.css">
  {% block head %}{% endblock %}
</head>
<body class="tv-page-{{ page }}" data-page="{{ page }}" data-root="{{ root }}" data-surface="{{ surface }}"{% if item_id is defined %} data-item-id="{{ item_id }}"{% endif %}>
  <header class="tv-bar">
    <a class="tv-brand" href="{{ root }}" aria-label="Northern Lights home">Northern Lights</a>
    {% if page != 'who' %}<div class="tv-bar-row" data-nl-row="nav" data-nl-skip-initial>
      <nav class="tv-nav" aria-label="Sections">
        <a class="tv-pill" data-nl-focus href="{{ root }}">Home</a>
        <a class="tv-pill" data-nl-focus href="{{ root }}downloads">Downloads</a>
        <a class="tv-pill" data-nl-focus href="{{ root }}search">Search</a>
      </nav>
      {% if people_configured and viewer %}<a class="tv-account" data-nl-focus href="{{ root }}me" aria-label="{{ viewer.label }}: profile, languages and who's watching">
        <span class="tv-account-avatar" aria-hidden="true">{{ '&' if viewer.both else viewer.label[:1] }}</span>
        <span class="tv-account-name">{{ viewer.label }}</span>
      </a>{% endif %}
    </div>{% endif %}
    <div class="tv-health" id="tv-health" hidden></div>
    <span class="tv-foil" aria-hidden="true"></span>
  </header>
  <main id="tv-main">
    <p id="tv-status" class="tv-status" role="status">Loading&hellip;</p>
    {% block main %}{% endblock %}
  </main>
  <script src="/static/nl/nl.js"></script>
  <script src="/static/nl/watch.js"></script>
  <script src="/static/nl/polish.js"></script>
  <script src="/static/nl/couple.js"></script>
  <script src="/static/nl/health.js"></script>
  <script src="/static/nl/tv/focus.js"></script>
  <script src="/static/nl/prefs.js"></script>
  <script src="/static/nl/subtitles.js"></script>
  {% block scripts %}{% endblock %}
  <script src="/static/nl/tv/tv.js"></script>
</body>
</html>
