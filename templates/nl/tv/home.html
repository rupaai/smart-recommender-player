{% extends "nl/tv/base.html" %}
{% block main %}
  <section id="tv-continue" class="tv-section" hidden aria-labelledby="tv-continue-h">
    <h2 id="tv-continue-h">Continue watching</h2>
    <ul class="tv-row" data-nl-row="continue" id="tv-continue-list"></ul>
  </section>
  <section id="tv-picks" class="tv-section" hidden aria-labelledby="tv-picks-h">
    <h2 id="tv-picks-h">{{ group_label }}</h2>
    <p id="tv-picks-note" class="tv-picks-note"></p>
    <div id="tv-picks-chips" class="tv-chips" data-nl-row="picks-chips"></div>
    <ul class="tv-row" data-nl-row="picks" id="tv-picks-list"></ul>
  </section>
  <section id="tv-recent-added" class="tv-section" hidden aria-labelledby="tv-recent-added-h">
    <h2 id="tv-recent-added-h">Recently added</h2>
    <ul class="tv-row" data-nl-row="recent-added" id="tv-recent-added-list"></ul>
  </section>
  <section id="tv-recent-watched" class="tv-section" hidden aria-labelledby="tv-recent-watched-h">
    <h2 id="tv-recent-watched-h">Recently watched</h2>
    <ul class="tv-row" data-nl-row="recent-watched" id="tv-recent-watched-list"></ul>
  </section>
  <div id="tv-filters" class="tv-filters" hidden>
    <div id="tv-filters-box" class="tv-filters-inner" data-nl-row="filters"></div>
    <p id="tv-filters-note" class="tv-meta" role="status"></p>
  </div>
  <section id="tv-movies" class="tv-section" hidden aria-labelledby="tv-movies-h">
    <h2 id="tv-movies-h">Movies</h2>
    <ul class="tv-row" data-nl-row="movies" id="tv-movies-list"></ul>
  </section>
  <section id="tv-shows" class="tv-section" hidden aria-labelledby="tv-shows-h">
    <h2 id="tv-shows-h">Shows</h2>
    <ul class="tv-row" data-nl-row="shows" id="tv-shows-list"></ul>
  </section>
{% endblock %}
