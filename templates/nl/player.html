<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Northern Lights player</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #e8e8e8; font-family: system-ui, sans-serif; }
    video { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; }
    #nl-error { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      padding: 24px; text-align: center; font-size: 1.1rem; }
  </style>
</head>
<body data-item-id="{{ item_id }}">
  <video id="nl-video" controls playsinline autoplay></video>
  <div id="nl-error" role="alert"></div>
  <!-- hls.js 1.5.20 is vendored; only player-core.js may touch it. -->
  <script src="/static/nl/vendor/hls.min.js"></script>
  <script src="/static/nl/player-core.js"></script>
  <script src="/static/nl/play.js"></script>
</body>
</html>
