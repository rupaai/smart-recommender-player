[project]
name = "smart-movie-streamer"
version = "0.1.0"
description = "A modular Home Streaming & Movie Recommender System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "jinja2>=3.1.3",
    "libtorrent>=2.1.1",
    "guessit>=4.4.0",
    "qbittorrent>=0.1.6",
    "websockets>=16.1.1",
]

[project.scripts]
movie-web = "server:run_server"
movie-hub = "app:main_menu"
movie-scanner = "scanner:main"
movie-enricher = "enricher:main"
movie-recommender = "recommender:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "app.py",
    "server.py",
    "database.py",
    "scanner.py",
    "enricher.py",
    "recommender.py",
    "templates",
    "static",
]
