[project]
name = "smart-movie-streamer"
version = "0.3.0"
description = "A self-hosted movie & TV streamer, downloader and recommender for Raspberry Pi / Mac"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "jinja2>=3.1.3",
    "libtorrent>=2.1.1",
    "guessit>=4.4.0",
    "onnxruntime>=1.17.0,<1.24",
]

[project.scripts]
movie-web = "server:run_server"
movie-scanner = "scanner:main"
movie-enricher = "enricher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "server.py",
    "database.py",
    "scanner.py",
    "enricher.py",
    "services",
    "templates",
    "static",
]
