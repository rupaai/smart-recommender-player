[project]
name = "smart-movie-streamer"
version = "0.3.0"
description = "A self-hosted movie & TV streamer, downloader and recommender for Raspberry Pi / Mac"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "jinja2>=3.1.3",
    "libtorrent>=2.1.1",
    "guessit>=4.4.0",
    "onnxruntime>=1.17.0,<1.24",
    "tokenizers>=0.15",
    "homelab-sdk @ git+https://github.com/rupaai/homelab@a7cfc757be68dc2f84858d0c81b31a4be1c61bba#subdirectory=plugins/python",
]

[project.optional-dependencies]
# Mac-only extras. `uv run --extra llm ...` for the mood tagger (utils/mood_tag.py).
llm = ["anthropic>=1.0"]

[project.scripts]
movie-web = "server:run_server"
movie-scanner = "scanner:main"
movie-enricher = "enricher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The Homelab plugin is a git dependency.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
only-include = [
    "server.py",
    "database.py",
    "services",
    "web",
    "templates",
    "static",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]

[tool.ruff.lint]
# Syntax errors and undefined names only; no style or formatting rules.
select = ["E9", "F63", "F7", "F82"]
