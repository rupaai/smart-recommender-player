tv_genre_aliases:
  action: [Action & Adventure, Action]
  adventure: [Action & Adventure, Adventure]
  science fiction: [Sci-Fi & Fantasy, Science Fiction]
  sci-fi: [Sci-Fi & Fantasy, Sci-Fi]
  fantasy: [Sci-Fi & Fantasy, Fantasy]
  family: [Family, Kids]
  war: [War & Politics, War]

# ---------------------------------------------------------------------------
# Wishmatch (the new recommender, PROJECT_HANDOVER.md §17)
# ---------------------------------------------------------------------------
# Used only when config.yaml says recommender.engine: wishmatch. The legacy engine
# above never reads this section. Words here must be words of services/vibe_vocab.py:
# trait names are its dials (0 = low end, 1 = high end), tag names come from its
# feels, good-for, setting, season and content-flag lists.
wishmatch:
  # How many candidates are scored, and the film / show split when no type is chosen.
  candidates:
    total: 2000
    kinds: {movie: 0.7, tv: 0.3}              # about 1,400 films and 600 shows
    known: [well, somewhat]                   # how well Haiku knew the title
    min_popularity: {somewhat: 100}           # a "somewhat" title needs this many TMDB votes
    hidden_gem_known: [somewhat, not]         # used instead when the wish asks for hidden gems
  # Share of films and shows in the results when no type is chosen (one pick in three is a show).
  mix: {movie: 0.67, tv: 0.33}
  # score = match x fit to the wish + taste x fit to your tastes + quality x TMDB rating.
  weights:
    match: 1.0
    taste: 0.6
    quality: 0.3
    crowd: 0.0          # MovieLens, from build step 3
    trait: 1.0          # inside the match: a mood dial the wish names
    tag: 1.0            # inside the match: a feeling or occasion the wish names
    avoid_tag: 1.0      # inside the match: something the wish does not want
  people:
    other_weight: 0.2       # alone: the other person's taste counts this much
    together_dislike: 0.5   # together: push down by this x how much the less keen of you dislikes it
  taste:
    shrink: 5.0             # ratings needed before a taste counts fully
    tag_shrink: 3.0
    trait_weight: 0.5       # half the taste score from mood dials, half from feelings
  explain:
    max_reasons: 3
    hide_groups: [flags]    # content warnings (infidelity, animal harm) are never shown as reasons
  questions: {max: 2}       # build step 5
  tagging_model: ""         # open-weight Ollama model for new titles, picked by the bake-off (step 6)
  # TMDB rating -> quality 0..1: quality_floor scores 0, quality_ceiling scores 1.
  quality_floor: 5.0
  quality_ceiling: 8.5
  # Plain word lookup that turns a typed wish into mood words (build step 4 adds a
  # language model; this stays as its fallback). Phrases match longest first; a
  # "no" / "not" just before a phrase flips it. Every feeling and occasion word in
  # vibe_vocab.py ("cozy", "date night", "bad day") is understood without listing it here.
  lexicon:
    traits:
      relaxing: {energy: 0.2, tension: 0.1}
      relaxed: {energy: 0.2, tension: 0.1}
      chill: {energy: 0.2, tension: 0.1}
      calm: {energy: 0.1, tension: 0.1}
      easy: {attention: 0.2}
      easy watch: {attention: 0.1, weight: 0.2}
      light: {weight: 0.2, darkness: 0.2}
      lighthearted: {weight: 0.2, darkness: 0.1}
      feel good: {ending_valence: 0.9, weight: 0.2}
      feel-good: {ending_valence: 0.9, weight: 0.2}
      happy ending: {ending_valence: 0.9}
      uplifting: {ending_valence: 0.9}
      funny: {humour: 0.9}
      laugh: {humour: 0.9}
      make me laugh: {humour: 0.9}
      make us laugh: {humour: 0.9}
      hilarious: {humour: 1.0}
      comedy: {humour: 0.8}
      intense: {energy: 0.9, tension: 0.8}
      exciting: {energy: 0.8, pace: 0.8}
      action: {energy: 0.9, spectacle: 0.7}
      fast: {pace: 0.9}
      fast paced: {pace: 0.9}
      slow: {pace: 0.2}
      slow burn: {pace: 0.2, tension: 0.6}
      gripping: {tension: 0.8, attention: 0.7}
