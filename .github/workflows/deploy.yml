name: Deploy

# Manual only. Press "Run workflow" to put a commit on the server. It must already have a
# green CI run and a built image; otherwise it stops at `verify` and nothing changes.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy (older commit = rollback)
        required: true
        default: main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      REF: ${{ inputs.ref }}
    steps:
      - name: Resolve the ref to a commit
        id: resolve
        run: |
          sha="$(gh api "repos/$REPO/commits/$REF" --jq .sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Could not resolve '$REF' to a commit"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $REF = $sha" >> "$GITHUB_STEP_SUMMARY"
      - name: CI passed for that commit
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          n="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=50" --jq .total_count)"
          if [ "$n" -lt 1 ]; then
            echo "::error::No successful CI run for $SHA. Wait for CI to go green (or fix it) first."
            exit 1
          fi
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The image for that commit exists
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          docker manifest inspect "ghcr.io/${REPO}:sha-${SHA}" > /dev/null || {
            echo "::error::No image ghcr.io/${REPO}:sha-${SHA}. Only commits that reached main get an image."
            exit 1
          }

  deploy:
    needs: verify
    runs-on: [self-hosted, mars]
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    timeout-minutes: 20
    env:
      SHA: ${{ needs.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - name: Log in to GHCR (kept only for this job)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
          echo "$GH_TOKEN" | DOCKER_CONFIG="$RUNNER_TEMP/docker" docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Deploy
        run: bash deploy/deploy.sh "sha-$SHA"
      - name: Forget the registry login
        if: always()
        run: rm -rf "$RUNNER_TEMP/docker"
      - name: Tell the phones
        if: always()
        env:
          RESULT: ${{ job.status }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$RESULT" = success ]; then
            /srv/couchcinema/bin/notify.sh "Deployed" "${SHA:0:7} is live (by $ACTOR)" default white_check_mark
          else
            /srv/couchcinema/bin/notify.sh "Deploy FAILED" "${SHA:0:7} ($RESULT). Check the Deploy run on GitHub; a failed health check rolls back automatically." high rotating_light
          fi
