name: TV app

on:
  pull_request:
    paths:
      - "tv-app/**"
      - ".github/workflows/tv-app.yml"
  push:
    paths:
      - "tv-app/**"
      - ".github/workflows/tv-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest ships the Android SDK ($ANDROID_HOME); the wrapper pins Gradle 8.10.2.
      - uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Lint
        run: ./gradlew --no-daemon lintDebug
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        with:
          name: northern-lights-tv-debug
          path: tv-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
