name: TV app

on:
  pull_request:
    paths:
      - "tv-app/**"
      - ".github/workflows/tv-app.yml"
  push:
    paths:
      - "tv-app/**"
      - ".github/workflows/tv-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest ships the Android SDK ($ANDROID_HOME); the wrapper pins Gradle 8.10.2.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon lintDebug
        continue-on-error: true
      # The run number in the file name tells one download from the next (the app shows it as version 1.0.<run>).
      - name: Name the APK after the build
        run: mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/northern-lights-tv-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: northern-lights-tv-${{ github.run_number }}
          path: tv-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
