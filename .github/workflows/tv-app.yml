name: TV app

on:
  pull_request:
    paths:
      - "tv-app/**"
      - ".github/workflows/tv-app.yml"
  push:
    paths:
      - "tv-app/**"
      - ".github/workflows/tv-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest ships the Android SDK ($ANDROID_HOME); the wrapper pins Gradle 8.10.2.
      - uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon lintDebug
        continue-on-error: true
      # The run number in the file name tells one download from the next (the app shows it as version 1.0.<run>).
      - name: Name the APK after the build
        run: mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/northern-lights-tv-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: northern-lights-tv-${{ github.run_number }}
          path: tv-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # The app updates itself from the fixed release `tv-app` (see UpdateCheck.kt): it reads version.json and,
  # when versionCode is bigger than its own, downloads northern-lights-tv.apk. Only main builds go there.
  # The tag is not a version number and the release is a pre-release, so it stays apart from vX.Y.Z releases.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: tv-app-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN: ${{ github.run_number }}
    steps:
      - name: Get the APK from the build job
        run: |
          gh run download "$GITHUB_RUN_ID" -n "northern-lights-tv-$RUN" -D apk
          mv "apk/northern-lights-tv-$RUN.apk" northern-lights-tv.apk
          printf '{"versionCode": %s, "sha": "%s"}\n' "$RUN" "$GITHUB_SHA" > version.json
      - name: Put it on the tv-app release
        run: |
          gh release view tv-app >/dev/null 2>&1 || gh release create tv-app --prerelease --target "$GITHUB_SHA" \
            --title "TV app (newest build)" --notes "The TV app downloads its updates from here."
          # APK first, then version.json, so the app is never told about a build that is not there yet.
          gh release upload tv-app northern-lights-tv.apk --clobber
          gh release upload tv-app version.json --clobber
          gh release edit tv-app --notes "Newest TV app: version 1.0.$RUN, built from $GITHUB_SHA. The TV app downloads its updates from here."
