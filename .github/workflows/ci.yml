name: CI

on:
  pull_request:
  push:
    # The Northern Lights branch also gets images so Deploy can put it on mars for testing.
    branches: [main, northern-lights-player-app]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: make check

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      # Docker Hub rate-limits anonymous pulls from shared runners (429s, timeouts), so
      # the base image and BuildKit come from the AWS public mirror of the same images.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1
      # Pushes publish; pull requests just prove the image builds.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BASE_IMAGE=public.ecr.aws/docker/library/python:3.12-slim
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:main', env.IMAGE) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
