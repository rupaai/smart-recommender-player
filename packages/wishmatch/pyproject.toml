[project]
name = "wishmatch"
version = "0.1.0"
description = "Recommend items from a typed wish, item descriptions and people's tastes. No dependencies."
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wishmatch"]
